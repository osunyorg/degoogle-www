[build]
  publish = "public"
  command = "yarn osuny build"

[build.environment]
  HUGO_VERSION = "0.165.0"

[context.branch-deploy.environment]
  HUGO_ENV = "staging"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "0"
    X-Content-Type-Options = "nosniff"

# One [[headers]] block per glob — "for" must be a string, not an array
[[headers]]
  for = "**/*.woff2"
  [headers.values]
    Cache-Control = "max-age=31536000, no-transform, public"

[[headers]]
  for = "**/*.woff"
  [headers.values]
    Cache-Control = "max-age=31536000, no-transform, public"

[[headers]]
  for = "**/*.svg"
  [headers.values]
    Cache-Control = "max-age=31536000, no-transform, public"

[[headers]]
  for = "**/*.ttf"
  [headers.values]
    Cache-Control = "max-age=31536000, no-transform, public"

[[headers]]
  for = "**/*.otf"
  [headers.values]
    Cache-Control = "max-age=31536000, no-transform, public"

[[headers]]
  for = "**/*.eot"
  [headers.values]
    Cache-Control = "max-age=31536000, no-transform, public"

[[headers]]
  for = "**/*.js"
  [headers.values]
    Cache-Control = "max-age=31536000, no-transform, public"

[[headers]]
  for = "**/*.css"
  [headers.values]
    Cache-Control = "max-age=31536000, no-transform, public"

[[headers]]
  for = "**/*.png"
  [headers.values]
    Cache-Control = "max-age=31536000, no-transform, public"

[[headers]]
  for = "**/*.jpg"
  [headers.values]
    Cache-Control = "max-age=31536000, no-transform, public"

[[headers]]
  for = "**/*.jpeg"
  [headers.values]
    Cache-Control = "max-age=31536000, no-transform, public"

[[headers]]
  for = "**/*.gif"
  [headers.values]
    Cache-Control = "max-age=31536000, no-transform, public"

[[headers]]
  for = "**/*.webp"
  [headers.values]
    Cache-Control = "max-age=31536000, no-transform, public"

[[cors]]
  allowed_origins = "*"
  allowed_methods = ["GET", "POST"]
  allowed_headers = "*"

